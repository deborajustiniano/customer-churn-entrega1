services:
  api:
    build: .
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); data = json.load(r); assert r.status == 200 and data == {'status': 'ok', 'model_loaded': True}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
